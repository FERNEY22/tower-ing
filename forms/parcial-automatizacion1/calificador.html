  .esc .obs{flex:1;min-width:160px;font:13px var(--sans);padding:7px 9px;border:1px solid var(--regla);background:#fff}

<script>
"use strict";
const NODO = "parcial_automatizacion1";
const $ = s => document.querySelector(s);
const marco = $("#marco"), cajetin = $("#cajetin");
const db = () => firebase.database();
const esc = s => (s==null?"":(""+s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const estado = t => { $("#pieEstado").textContent = t; };

/* ═══════════ normalización y comparadores ═══════════ */
const DIACRITICO = new RegExp("[\u0300-\u036f]", "g");
const norm = s => (s==null?"":(""+s)).toLowerCase().normalize("NFD").replace(DIACRITICO,"").replace(/\s+/g," ").trim();
const numero = s => { if(s==null) return null; const v = parseFloat((""+s).replace(",",".").replace(/[^0-9.eE+-]/g,"")); return isNaN(v)?null:v; };
const errpct = (a,b) => (a==null||b==null||b===0) ? Infinity : Math.abs(a-b)/Math.abs(b)*100;
const STOP = new Set(["de","del","la","el","los","las","por","con","para","una","uno","que","los","sus","como","este","esta","desde","hacia","sobre","entre","cada","mas","muy"]);
function claves(s){ return norm(s).split(/[^a-z0-9]+/).filter(w => w.length>=4 && !STOP.has(w)); }
function parecido(resp, clave, minRatio){
  const t = claves(clave); if(!t.length) return false;
  const r = norm(resp); if(!r) return false;
  const hits = t.filter(w => r.includes(w.slice(0, Math.max(4, w.length-2)))).length;
  return hits >= Math.max(1, Math.ceil(t.length*(minRatio||0.3)));
}
const contiene = (resp, ...frag) => { const r = norm(resp); return frag.every(f => r.includes(norm(f))); };
const alguno   = (resp, ...frag) => { const r = norm(resp); return frag.some(f => r.includes(norm(f))); };

/* ═══════════ frontera con la base ═══════════
   Los códigos de evidencia llevan punto y RTDB no admite ".", "#", "$", "/",
   "[" ni "]" en una clave: viajan como VALOR de fila, no como nombre de campo.
   aMapa acepta las dos formas por si quedó algún registro viejo. */
const aFilas = (mapa, campo) => Object.keys(mapa || {}).map(c => ({codigo:c, [campo]:mapa[c]}));
const aMapa  = (filas, campo) => {
  const o = {};
  if(!filas) return o;
  const esFila = Array.isArray(filas) || Object.prototype.hasOwnProperty.call(filas, "0");
  if(!esFila) return filas;                       // registro antiguo: ya era un mapa
  Object.values(filas).forEach(f => { if(f && f.codigo != null) o[f.codigo] = f[campo]; });
  return o;
};
const respuestasDe = ent => aMapa(ent && ent.respuestas, "campos");

/* ═══════════ el banco, incrustado ═══════════ */
let BANCO = null, EVID = {B1:[],B2:[],P2:[]}, DESEMP = [];
function cargarBanco(){
  BANCO   = {en:BANCO_ENUNCIADOS, ev:BANCO_EVIDENCIAS};
  EVID.B1 = BANCO.ev.parte_1.evidencias.filter(x => x.bloque === "B1");
  EVID.B2 = BANCO.ev.parte_1.evidencias.filter(x => x.bloque === "B2");
  EVID.P2 = BANCO.ev.parte_2.evidencias;
  DESEMP  = BANCO.ev.meta.desempenos;
}
const escenario = id => BANCO.en.escenarios.find(x => x.id === id) || null;
const motorDe   = e  => e ? BANCO.en.motores.find(m => m.id === e.motor) : null;

/* ═══════════ autocalificación del bloque B1 ═══════════ */
/* Devuelve {ejec:0..3|null, detalle:[{campo, resp, clave, ok}]}.
   ejec null = la evidencia no es automática y la califica el docente. */
function autoCalificar(cod, ent){
  const r  = respuestasDe(ent)[cod] || {};
  const E  = escenario(ent.escenario_id);
  const M  = motorDe(E);
  const d  = [];
  const fila = (campo, resp, clave, ok) => { d.push({campo, resp, clave, ok}); return ok; };

  if(cod === "A.1.1"){
    const I = E.instrumentacion;
    let n = 0;
    n += fila("Variable controlada", r.variable,    I.variable_controlada, parecido(r.variable,    I.variable_controlada)) ? 1:0;
    n += fila("Sensor",              r.sensor,      I.sensor,              parecido(r.sensor,      I.sensor))              ? 1:0;
    n += fila("Actuador",            r.actuador,    I.actuador,            parecido(r.actuador,    I.actuador))            ? 1:0;
    n += fila("Controlador",         r.controlador, I.controlador,         parecido(r.controlador, I.controlador))         ? 1:0;
    return {ejec: n===4?3 : n===3?2 : n>=1?1 : 0, detalle:d, resumen:`${n} de 4 elementos`};
  }

  if(cod === "A.1.2"){
    const I  = E.instrumentacion;
    const ok = norm(r.lazo) === norm(I.lazo);
    fila("Tipo de lazo", r.lazo, I.lazo, ok);
    const j  = r.justificacion || "";
    const fuerte = alguno(j, "realiment", "feedback", "corrige la accion", "modifica la accion", "corrige el control", "modifica el control");
    fila("Justificación", j, I.justificacion_lazo, fuerte);
    const ejec = !ok ? 0 : (norm(j).length < 15 ? 1 : (fuerte ? 3 : 2));
    return {ejec, detalle:d, resumen: ok ? (fuerte ? "lazo y justificación correctos" : "lazo correcto, revisar justificación") : "lazo mal clasificado", revisar:true};
  }

  if(cod === "A.1.3"){
    const c = E.escalado.clave, u = E.escalado.unidad;
    const v = numero(r.valor), e = errpct(v, c);
    const uOk = norm(r.unidad) === norm(u);
    fila("Valor", r.valor==null?"":r.valor+"", `${c} ${u}  (±2 %)`, e <= 2);
    fila("Unidad", r.unidad, u, uOk);
    const sinOffset = E.escalado.LRV + (numero(E.escalado.corriente_mA)/20)*(E.escalado.URV - E.escalado.LRV);
    let ejec;
    if(e <= 2)                    ejec = uOk ? 3 : 2;
    else if(e <= 10)              ejec = 2;
    else if(errpct(v, sinOffset) <= 3) ejec = 1;   // planteó la proporción pero olvidó los 4 mA
    else                          ejec = 0;
    return {ejec, detalle:d, resumen:`error ${isFinite(e)?e.toFixed(1)+" %":"—"}`};
  }

  if(cod === "A.2.10"){
    const TAGS = {
      "Q1":["circuit breaker","main breaker","mcb"],
      "KM1":["main contactor","contactor"],
      "F2":["motor overload","thermal overload","overload relay"],
      "S0":["e-stop","emergency stop","estop"],
      "S1":["stop"],
      "S2":["start"],
      "H1":["running","run"],
      "H2":["fault"],
      "H3":["ready"],
      "HA1":["start warning horn","warning horn","horn"],
      "HA2":["fault alarm","alarm"]
    };
    const els = E.sistema_A.elementos;
    let ok = 0, llenas = 0;
    els.forEach((el,i) => {
      const key = (el.match(/^[A-Z]+[0-9]*/)||[""])[0];
      const admitidos = TAGS[key] || [];
      const tag = r["t"+i] || "";
      const lleno = (r["b"+i]||"").trim() !== "" && (r["f"+i]||"").trim() !== "" && tag.trim() !== "";
      if(lleno) llenas++;
      const bien = admitidos.some(a => norm(tag) === norm(a) || norm(tag).includes(norm(a)));
      if(bien) ok++;
      fila(el, `${r["b"+i]||"—"} · ${r["f"+i]||"—"} · ${tag||"—"}`, admitidos.join(" / ")||"—", bien && lleno);
    });
    const ratio = els.length ? ok/els.length : 0;
    const ejec = (ratio >= 0.9 && llenas === els.length) ? 3 : ratio >= 0.6 ? 2 : ratio > 0 ? 1 : 0;
    return {ejec, detalle:d, resumen:`${ok} de ${els.length} tags · ${llenas} filas completas`, revisar:true};
  }

  /* Selección múltiple: se compara el TEXTO elegido contra la clave del banco,
     porque el orden que vio el estudiante fue barajado con su documento.
     La de escenario pesa más que la conceptual: aplicar el criterio > reconocerlo. */
  if(cod === "A.4.1" || cod === "A.4.2"){
    const E4 = EVID.B1.find(x => x.codigo === cod);
    const marca = {};
    E4.preguntas.forEach(q => {
      const clave = q.tipo === "escenario" ? q.correcta[E.motor] : q.correcta;
      const dada  = r[q.id];
      marca[q.tipo] = norm(dada) === norm(clave);
      fila(q.enunciado, dada, clave, marca[q.tipo]);
    });
    const ejec = (marca.escenario && marca.conceptual) ? 3
               : marca.escenario ? 2
               : marca.conceptual ? 1 : 0;
    return {ejec, detalle:d,
            resumen:`escenario ${marca.escenario?"✔":"✘"} · conceptual ${marca.conceptual?"✔":"✘"}`};
  }

  if(cod === "A.4.3"){
    const ref = M.clave.KM_ref + "/M";
    let n = 0;
    n += fila("Q1 · contactor reference", r.q1, ref,
              norm(r.q1).replace(/\s/g,"").includes(norm(ref).replace(/\s/g,""))) ? 1:0;
    n += fila("Q2 · terminals", r.q2, "95-96 en serie con la bobina (N/C); 97-98 para la alarma (N/O)",
              contiene(r.q2, "95", "96") && contiene(r.q2, "97", "98")) ? 1:0;
    n += fila("Q3 · setting dial", r.q3, "Set to the motor rated current, never higher",
              alguno(r.q3, "rated current", "motor current", "corriente nominal") &&
              alguno(r.q3, "never higher", "not higher", "never above", "nunca mayor", "never exceed")) ? 1:0;
    return {ejec: n===3?3 : n===2?2 : n===1?1 : 0, detalle:d, resumen:`${n} de 3 respuestas`};
  }

  return null;   // A.1.4 y A.4.4 — manuales
}

/* ═══════════ cálculo de la nota ═══════════ */
/* Una ejecución válida es 0, 1, 2 o 3. Cualquier otra cosa —undefined, null,
   texto, un número fuera de rango— significa SIN CALIFICAR, nunca el máximo.
   Con auto en 0 la evidencia vale 0. */
function nivel(v){
  if(typeof v === "string" && /^[0-3]$/.test(v.trim())) v = +v;
  return (typeof v === "number" && Number.isInteger(v) && v >= 0 && v <= 3) ? v : null;
}
const marcaDe = (cal, cod) => nivel(((cal || {}).ejecucion || {})[cod]);

function puntos(evidencia, ejec){ return ejec==null ? null : Math.round(evidencia.puntos_max * ejec / 3 * 100)/100; }

function calcular(ent, cal){
  const ej = (cal && cal.ejecucion) || {};
  const res = {b1:0, b1max:0, b2:0, b2max:0, p2:0, p2max:0, pend:[], porDesemp:{}, auto:{}};
  const acumular = (e, ejec, destino) => {
    res[destino+"max"] += e.puntos_max;
    if(ejec == null){ res.pend.push(e.codigo); return; }
    const p = puntos(e, ejec);
    res[destino] += p;
    const D = res.porDesemp[e.desempeno] || (res.porDesemp[e.desempeno] = {p:0, max:0});
    D.p += p; D.max += e.puntos_max;
  };
  EVID.B1.forEach(e => {
    const a = ent ? autoCalificar(e.codigo, ent) : null;
    res.auto[e.codigo] = a;
    const ejec = marcaDe(cal, e.codigo) != null ? marcaDe(cal, e.codigo) : (a ? nivel(a.ejec) : null);
    acumular(e, ejec, "b1");
  });
  EVID.B2.forEach(e => acumular(e, marcaDe(cal, e.codigo), "b2"));
  EVID.P2.forEach(e => acumular(e, marcaDe(cal, e.codigo), "p2"));
  res.parte1 = Math.round((res.b1 + res.b2)*100)/100;
  return res;
}

/* ═══════════ presencia ═══════════
   El latido lo estampa el servidor, así que se compara contra la hora del
   servidor y no contra el reloj del equipo del docente. */
const VIGENCIA_MS = 120000;
let desfase = 0;
try{ db().ref(".info/serverTimeOffset").on("value", s => desfase = s.val() || 0); }catch(e){}
const ahora = () => Date.now() + desfase;
const enLinea = x => x && x.visto && (ahora() - x.visto) < VIGENCIA_MS;
const haceCuanto = t => { const s = Math.max(0, Math.round((ahora() - t)/1000));
  return s < 60 ? "hace " + s + " s" : "hace " + Math.floor(s/60) + " min"; };

/* ═══════════ estado ═══════════ */
const S = {user:null, entregas:{}, sesiones:{}, calif:{}, asignacion:{}, vista:"lista", doc:null, refresco:null};

function pintarCajetin(){
  const n = Object.keys(S.entregas).length,
        b = Object.keys(S.sesiones).filter(d => enLinea(S.sesiones[d])).length;
  const cel = (k,v,cls="") => `<div class="cel"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  cajetin.innerHTML =
    cel("Instrumento","IFA00117 · Corte 1 · Parte 1") +
    cel("Docente", S.user ? esc(S.user.email) : "sin sesión") +
    cel("Entregas", n, "gr") +
    cel("En línea", b, "gr") +
    cel("Banco", BANCO ? "v"+BANCO.ev.meta.version : "—");
}

/* ═══════════ sesión ═══════════ */
function vLogin(msg){
  marco.innerHTML = `<div class="lienzo" style="max-width:460px">
    <h2 class="rot">Panel del docente</h2>
    <p class="lead">Entre con la cuenta de Firebase del curso para leer las entregas y calificar.</p>
    ${msg ? `<div class="caja ojo">${esc(msg)}</div>` : ""}
    <div style="margin-bottom:13px"><input class="in" id="mail" type="email" placeholder="correo" autocomplete="username"></div>
    <div style="margin-bottom:13px"><input class="in" id="pass" type="password" placeholder="contraseña" autocomplete="current-password"></div>
    <div class="barra"><button class="b" id="entrar">Entrar</button></div>
  </div>`;
  const ir = async () => {
    const b = $("#entrar"); b.disabled = true; b.textContent = "…";
    try{ await firebase.auth().signInWithEmailAndPassword($("#mail").value.trim(), $("#pass").value); }
    catch(e){ vLogin("No se pudo entrar: " + e.message); }
  };
  $("#entrar").onclick = ir;
  $("#pass").addEventListener("keydown", e => { if(e.key === "Enter") ir(); });
}

/* ═══════════ datos ═══════════ */
async function cargar(){
  estado("leyendo la base…");
  const leer = async ruta => { try{ return (await db().ref(`${NODO}/${ruta}`).once("value")).val() || {}; }
                              catch(e){ console.warn(ruta, e); return {}; } };
  const leerRuta = async ruta => { try{ return (await db().ref(ruta).once("value")).val() || {}; }
                                   catch(e){ console.warn(ruta, e); return {}; } };
  const [ent, ses, cal, asig, entR, sesR, calR] = await Promise.all([
    leer("entregas"), leer("sesiones"), leer("calificacion"), leer("asignacion"),
    leerRuta("diagnostico_control/parcial_c1_entregas"),
    leerRuta("diagnostico_control/parcial_c1_sesiones"),
    leerRuta("diagnostico_control/parcial_c1_calificacion")
  ]);
  // el respaldo se mezcla con lo principal: para el docente es una sola lista
  S.entregas   = Object.assign({}, entR, ent);
  S.sesiones   = Object.assign({}, sesR, ses);
  S.calif      = Object.assign({}, calR, cal);
  S.asignacion = asig;
  Object.keys(S.calif).forEach(d => {
    S.calif[d].ejecucion   = aMapa(S.calif[d].ejecucion,   "valor");
    S.calif[d].observacion = aMapa(S.calif[d].observacion, "texto");
  });
  pintarCajetin();
  estado("actualizado " + new Date().toLocaleTimeString("es-CO"));
}

/* ═══════════ listado ═══════════ */
function vLista(){
  S.vista = "lista";
  const docs = Object.keys(S.entregas).sort((a,b) =>
    (S.entregas[a].nombre||"").localeCompare(S.entregas[b].nombre||""));

  const filas = docs.map(d => {
    const e = S.entregas[d], c = S.calif[d], r = calcular(e, c);
    const pend = r.pend.length;
    return `<tr class="click" data-doc="${esc(d)}">
      <td class="el">${esc(d)}</td>
      <td style="font-family:var(--sans)">${esc(e.nombre||"")}</td>
      <td>${esc(e.escenario_id)}</td>
      <td class="num">${e.duracion_min||0}′</td>
      <td class="num">${r.b1.toFixed(1)} / 40</td>
      <td class="num">${r.b2.toFixed(1)} / 60</td>
      <td class="num">${r.p2.toFixed(1)} / 100</td>
      <td class="${pend?"no":"ok"}">${pend ? pend+" pend." : "cerrada"}</td>
      <td>${e.cerrado_por_tiempo ? "por tiempo" : ""}</td>
    </tr>`;
  }).join("");

  const presentes = Object.keys(S.sesiones).filter(d => !S.entregas[d] && enLinea(S.sesiones[d]));
  const enCurso = presentes.map(d => {
    const x = S.sesiones[d];
    const t = x.inicio ? Math.round((ahora()-x.inicio)/60000) : 0;
    const pct = x.avance || 0;
    return `<tr><td class="el">${esc(d)}</td><td style="font-family:var(--sans)">${esc(x.nombre||"")}</td>
      <td>${esc(x.escenario_id||"—")}</td><td class="num">${t}′</td>
      <td><div class="avance"><span style="width:${pct}%"></span></div>
          <div class="pct">${pct} % · ${x.respondidas||0} de ${x.total||9}</div></td>
      <td>${esc(haceCuanto(x.visto))}</td></tr>`;
  }).join("");

  const asignados = Object.values(S.asignacion);
  const reparto = BANCO.en.escenarios.map(x => {
    const entregados = docs.filter(d => S.entregas[d].escenario_id === x.id).length;
    const sorteados  = asignados.filter(a => a && a.escenario_id === x.id).length;
    return `<tr><td class="el">${esc(x.id)}</td><td style="font-family:var(--sans)">${esc(x.nombre)}</td>
      <td>${esc(x.motor)}</td><td class="num">${sorteados}</td><td class="num">${entregados}</td></tr>`;
  }).join("");

  marco.innerHTML = `<div class="lienzo">
    <div class="barra">
      <button class="b sec" id="rec">Actualizar</button>
      <button class="b sec" id="csv">Exportar CSV</button>
      <button class="b sec der" id="salir">Cerrar sesión</button>
    </div>
    <div class="subt">Entregas · ${docs.length}</div>
    ${docs.length ? `<div class="scroll"><table class="dat">
      <tr><th>Documento</th><th>Nombre</th><th>Esc.</th><th>Dur.</th><th>B1 auto</th><th>B2</th><th>Parte 2</th><th>Estado</th><th></th></tr>
      ${filas}</table></div>`
    : `<div class="caja">Todavía no hay entregas.</div>`}
    <div class="subt">En línea resolviendo · ${presentes.length}</div>
    ${enCurso ? `<div class="scroll"><table class="dat">
      <tr><th>Documento</th><th>Nombre</th><th>Esc.</th><th>Tiempo</th><th style="width:220px">Avance</th><th>Último latido</th></tr>
      ${enCurso}</table></div>`
     : `<div class="caja">Nadie con el examen abierto en este momento.</div>`}
    <div class="subt">Reparto de escenarios</div>
    <div class="scroll"><table class="dat">
      <tr><th>Id</th><th>Escenario</th><th>Motor</th><th>Sorteados</th><th>Entregados</th></tr>${reparto}</table></div>
    <p class="estado">Sorteados = asignaciones reales en la base (${asignados.length} en total).</p>
  </div>`;

  clearInterval(S.refresco);
  S.refresco = setInterval(async () => { if(S.vista === "lista"){ await cargar(); vLista(); } }, 30000);
  marco.querySelectorAll("tr.click").forEach(tr => tr.onclick = () => { S.doc = tr.dataset.doc; vEstudiante(); window.scrollTo({top:0}); });
  $("#rec").onclick   = async () => { await cargar(); vLista(); };
  $("#csv").onclick   = exportarCSV;
  $("#salir").onclick = () => firebase.auth().signOut();
}

/* ═══════════ ficha del estudiante ═══════════ */
function vEstudiante(){
  S.vista = "est";
  clearInterval(S.refresco); S.refresco = null;
  const d = S.doc, ent = S.entregas[d], cal = S.calif[d] || {ejecucion:{}, observacion:{}};
  const E = escenario(ent.escenario_id), M = motorDe(E);
  const r = calcular(ent, cal);

  const bloque = (lista, titulo, auto) => `<div class="subt">${titulo}</div>` + lista.map(e => {
    const a = auto ? r.auto[e.codigo] : null;
    const marcado  = marcaDe(cal, e.codigo);
    const efectivo = marcado != null ? marcado : (a ? nivel(a.ejec) : null);
    const detalle = a ? a.detalle.map(x => `<div class="par">
        <div><div class="h">${esc(x.campo)} — respuesta</div><div class="t">${esc(x.resp || "— vacío —")}</div></div>
        <div><div class="h">clave · <span class="${x.ok?"ok":"no"}">${x.ok?"coincide":"no coincide"}</span></div><div class="t mono">${esc(x.clave)}</div></div>
      </div>`).join("") : respuestaCruda(e, ent);
    const rub = e.rubrica ? `<div class="rub">${[0,1,2,3].map(n=>`<b>${n}</b> ${esc(e.rubrica[n]||"")}`).join("<br>")}</div>` : "";
    return `<div class="ev">
      <div class="cab"><span class="cod">${esc(e.codigo)}</span><span class="tt">${esc(e.enunciado)}</span>
        <span class="pt">${e.puntos_max} pts · ${efectivo!=null ? puntos(e, efectivo).toFixed(1) : "sin calificar"}</span></div>
      <div class="cue">
        ${detalle || quéRevisar(e, ent)}
        ${a && a.resumen ? `<div class="estado">auto: ${esc(a.resumen)}${a.revisar ? " · conviene revisar a mano" : ""}</div>` : ""}
        ${rub}
        <div class="esc" data-cod="${esc(e.codigo)}">
          <span class="lab">Ejecución</span>
          ${[0,1,2,3].map(n=>`<button data-n="${n}" class="${efectivo===n?"on":""}">${n}</button>`).join("")}
          ${a ? `<span class="auto">auto ${a.ejec}${marcado!=null && marcado!==a.ejec ? " · ajustado" : ""}</span>` : ""}
          <input class="obs" data-obs="${esc(e.codigo)}" placeholder="observación" value="${esc((cal.observacion||{})[e.codigo]||"")}">
        </div>
      </div></div>`;
  }).join("");

  marco.innerHTML = `<div class="lienzo">
    <div class="barra">
      <button class="b sec" id="volver">← Listado</button>
      <span class="estado" id="gd"></span>
      <button class="b sec der" id="sortear">Sortear falla y modificación</button>
    </div>
    <h2 class="rot">${esc(ent.nombre)}</h2>
    <p class="lead">Documento ${esc(d)} · ${esc(ent.correo||"")} · escenario <b>${esc(E.id)} — ${esc(E.nombre)}</b> · motor ${esc(M.id)} (I<sub>n</sub> = ${M.In_A} A)
      · ${ent.duracion_min||0} min · enviado ${esc((ent.enviado_en||"").replace("T"," ").slice(0,16))}${ent.cerrado_por_tiempo?" · cerrado por tiempo":""}</p>
    <div class="tot">
      <div><div class="k">B1 digital</div><div class="v">${r.b1.toFixed(1)}<span style="font-size:13px;color:var(--tenue)"> /40</span></div></div>
      <div><div class="k">B2 planos</div><div class="v">${r.b2.toFixed(1)}<span style="font-size:13px;color:var(--tenue)"> /60</span></div></div>
      <div><div class="k">Parte 1</div><div class="v">${r.parte1.toFixed(1)}<span style="font-size:13px;color:var(--tenue)"> /100</span></div></div>
      <div><div class="k">Parte 2</div><div class="v">${r.p2.toFixed(1)}<span style="font-size:13px;color:var(--tenue)"> /100</span></div></div>
    </div>
    ${cal.falla || cal.modificacion ? `<div class="caja ojo">
      <b>Parte 2 · falla introducida:</b> ${esc(textoFalla(cal.falla))}<br>
      <b>Modificación en vivo:</b> ${esc(textoMod(cal.modificacion))}</div>` : ""}
    ${bloque(EVID.B1, "Bloque B1 — digital, autocalificado (40 pts)", true)}
    ${bloque(EVID.B2, "Bloque B2 — planos de CADe_SIMU (60 pts)", false)}
    ${bloque(EVID.P2, "Parte 2 — montaje en el banco (100 pts)", false)}
  </div>`;

  $("#volver").onclick  = () => { vLista(); window.scrollTo({top:0}); };
  $("#sortear").onclick = sortearParte2;
  marco.querySelectorAll(".esc").forEach(g => {
    g.querySelectorAll("button").forEach(b => b.onclick = () => marcar(g.dataset.cod, +b.dataset.n));
  });
  marco.querySelectorAll("[data-obs]").forEach(i => i.onchange = () => observar(i.dataset.obs, i.value));
}

/* Qué tiene el docente delante cuando la evidencia no se autocalifica:
   en el bloque B2, el archivo de CADe_SIMU que le corresponde revisar;
   en la Parte 2, el montaje en el banco. */
function quéRevisar(e, ent){
  if(e.bloque === "B2"){
    const suyos = PLANOS.filter(p => p.evid.includes(e.codigo));
    if(!suyos.length) return `<div class="caja">Sin archivo asociado.</div>`;
    return `<div class="caja"><div class="h" style="font:600 9px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);margin-bottom:7px">Archivo${suyos.length>1?"s":""} a revisar</div>` +
      suyos.map(p => `<div style="font:600 13.5px var(--mono);margin-bottom:3px">` +
        esc(`${ent.escenario_id}_SIS-${p.sis}_${p.plano}_${ent.documento}`) +
        `</div><div style="font-size:12.5px;color:var(--tenue);margin-bottom:8px">${esc(p.det)}` +
        (p.evid.length > 1 ? ` · el mismo plano responde por ${esc(p.evid.join(", "))}` : "") +
        `</div>`).join("") + `</div>`;
  }
  return `<div class="caja">Evidencia presencial — se califica en el banco durante la Parte 2.</div>`;
}

/* Evidencias sin autocalificación: se muestra la respuesta cruda si existe */
function respuestaCruda(e, ent){
  const r = respuestasDe(ent)[e.codigo];
  if(!r) return "";
  const campos = Object.keys(r).map(k => `<div class="par uno">
      <div><div class="h">${esc(k)}</div><div class="t">${esc(r[k] || "— vacío —")}</div></div>
    </div>`).join("");
  const criterio = e.clave ? `<div class="crit"><div class="h">Criterio</div><div class="t">${esc(e.clave)}</div></div>` : "";
  return campos + criterio;
}

function textoFalla(id){
  const f = ((BANCO.en.parte2_reduccion.falla_introducida.catalogo)||[]).find(x => x.id === id);
  return f ? `${f.id} — ${f.falla} (síntoma: ${f.sintoma})` : "sin sortear";
}
function textoMod(id){
  const v = ((BANCO.en.parte2_reduccion.modificacion_en_vivo.catalogo)||[]).find(x => x.id === id);
  return v ? `${v.id} — ${v.peticion}` : "sin sortear";
}

/* ═══════════ escritura ═══════════ */
async function guardarCal(parcial){
  const d = S.doc;
  const base = S.calif[d] || {ejecucion:{}, observacion:{}};
  const nuevo = Object.assign(base, parcial, {
    documento:d, actualizado_en:new Date().toISOString(),
    calificado_por: S.user ? S.user.email : ""
  });
  S.calif[d] = nuevo;
  const payload = Object.assign({}, nuevo, {
    ejecucion:   aFilas(nuevo.ejecucion,   "valor"),
    observacion: aFilas(nuevo.observacion, "texto")
  });
  const gd = $("#gd"); if(gd) gd.textContent = "guardando…";
  /* Mismo respaldo que usa el formulario: si el nodo del parcial está denegado,
     la nota se guarda en diagnostico_control, que las reglas vigentes permiten. */
  try{
    await db().ref(`${NODO}/calificacion/${d}`).update(payload);
    if(gd) gd.textContent = "guardado";
  }catch(e){
    console.warn("calificación · nodo principal rechazado:", e && e.message);
    try{
      await db().ref(`diagnostico_control/parcial_c1_calificacion/${d}`).update(payload);
      if(gd) gd.textContent = "guardado (respaldo)";
    }catch(e2){
      console.error("calificación:", e2);
      if(gd) gd.textContent = "NO se pudo guardar: " + (e2 && e2.message);
    }
  }
}
function marcar(cod, n){
  const cal = S.calif[S.doc] || {ejecucion:{}};
  const ej = Object.assign({}, cal.ejecucion || {});
  if(ej[cod] === n) delete ej[cod]; else ej[cod] = n;      // volver a pulsar devuelve el control al automático
  const y = window.scrollY;
  guardarCal({ejecucion:ej}).then(() => { vEstudiante(); window.scrollTo(0, y); });
}
function observar(cod, txt){
  const cal = S.calif[S.doc] || {};
  const ob = Object.assign({}, cal.observacion || {});
  if(txt.trim()) ob[cod] = txt.trim(); else delete ob[cod];
  guardarCal({observacion:ob});
}
function sortearParte2(){
  const F = BANCO.en.parte2_reduccion.falla_introducida.catalogo;
  const V = BANCO.en.parte2_reduccion.modificacion_en_vivo.catalogo;
  guardarCal({
    falla:        F[Math.floor(Math.random()*F.length)].id,
    modificacion: V[Math.floor(Math.random()*V.length)].id
  }).then(vEstudiante);
}

/* ═══════════ CSV ═══════════ */
function exportarCSV(){
  const cods = [...EVID.B1, ...EVID.B2, ...EVID.P2].map(e => e.codigo);
  const cab = ["documento","nombre","correo","escenario","motor","duracion_min","enviado_en","B1","B2","parte1","parte2", ...cods];
  const q = v => `"${(""+(v==null?"":v)).replace(/"/g,'""')}"`;
  const filas = Object.keys(S.entregas).map(d => {
    const e = S.entregas[d], c = S.calif[d], r = calcular(e, c);
    const ej = (c && c.ejecucion) || {};
    const notas = cods.map(cd => {
      if(cd in ej) return ej[cd];
      const a = r.auto[cd];
      return a ? a.ejec : "";
    });
    return [d, e.nombre, e.correo, e.escenario_id, e.motor_id, e.duracion_min, e.enviado_en,
            r.b1.toFixed(2), r.b2.toFixed(2), r.parte1.toFixed(2), r.p2.toFixed(2), ...notas].map(q).join(";");
  });
  const csv = "﻿" + [cab.map(q).join(";"), ...filas].join("\r\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
  a.download = `IFA00117_corte1_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

/* ═══════════ arranque ═══════════ */
firebase.auth().onAuthStateChanged(async u => {
  S.user = u;
  pintarCajetin();
  if(!u){ vLogin(); return; }
  marco.innerHTML = `<div class="lienzo"><p class="lead">Cargando…</p></div>`;
  if(!BANCO) cargarBanco();
  await cargar();
  vLista();
});
pintarCajetin();
</script>
