<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Parcial Corte 1 · IFA00117 — Automatización de Procesos</title>
<style>
  :root{
    --papel:#e7e5dd; --hoja:#fbfaf6; --panel:#f3f1e9;
    --tinta:#171816; --grafito:#4a4d47; --tenue:#797d75;
    --regla:#c8c5ba; --regla2:#e0ddd3;
    --oxido:#95371a; --verde:#1e5b41; --ambar:#a06b06;
    --sans:"Helvetica Neue",Helvetica,Arial,"Segoe UI",sans-serif;
    --mono:"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--papel);color:var(--tinta);font:15px/1.55 var(--sans);padding:22px 16px 70px;-webkit-font-smoothing:antialiased}
  .hoja{max-width:1060px;margin:0 auto;background:var(--hoja);border:1px solid var(--tinta)}
  .franja{height:7px;background:var(--tinta)}

  /* ── cajetín superior ─────────────────────────────── */
  .cajetin{display:grid;grid-template-columns:2.4fr 1fr 1fr 1.1fr 1fr;border-bottom:1px solid var(--tinta)}
  .cel{padding:9px 13px;border-left:1px solid var(--regla);min-width:0}
  .cel:first-child{border-left:0}
  .cel .k{font:600 9.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--tenue)}
  .cel .v{font:13px/1.35 var(--mono);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cel .v.gr{font:600 15px/1.2 var(--mono)}
  .cel .v.rojo{color:var(--oxido)}
  @media(max-width:760px){.cajetin{grid-template-columns:1fr 1fr}.cel{border-left:1px solid var(--regla);border-top:1px solid var(--regla)}.cel:nth-child(odd){border-left:0}}

  /* ── estructura ───────────────────────────────────── */
  .tablero{display:grid;grid-template-columns:210px 1fr}
  .riel{border-right:1px solid var(--regla);background:var(--panel);padding:14px 0 20px}
  .riel .tit{font:600 9.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--tenue);padding:0 14px 10px}
  .riel button{display:flex;align-items:baseline;gap:9px;width:100%;padding:8px 13px;background:none;border:0;border-left:3px solid transparent;font:13px var(--sans);color:var(--grafito);text-align:left;cursor:pointer}
  .riel button:hover{background:#eceada}
  .riel button.on{background:var(--hoja);border-left-color:var(--oxido);color:var(--tinta);font-weight:700}
  .riel button .n{font:11px var(--mono);color:var(--tenue)}
  .riel button.on .n{color:var(--oxido)}
  .riel button .st{margin-left:auto;font:12px var(--mono);color:var(--verde)}
  .riel hr{border:0;border-top:1px solid var(--regla2);margin:10px 13px}
  .lienzo{padding:26px 30px 32px;min-width:0}
  @media(max-width:820px){
    .tablero{grid-template-columns:1fr}
    .riel{border-right:0;border-bottom:1px solid var(--regla);display:flex;overflow-x:auto;padding:0}
    .riel .tit,.riel hr{display:none}
    .riel button{width:auto;white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 13px}
    .riel button.on{border-left:0;border-bottom-color:var(--oxido)}
    .lienzo{padding:20px 18px 26px}
  }

  /* ── tipografía de contenido ──────────────────────── */
  h2.rot{font:700 19px/1.3 var(--sans);margin:0 0 4px;letter-spacing:-.01em}
  .lead{font-size:14.5px;color:var(--grafito);margin:0 0 20px;max-width:66ch}
  .evid{display:flex;align-items:baseline;gap:11px;border-bottom:1px solid var(--tinta);padding-bottom:9px;margin-bottom:18px;flex-wrap:wrap}
  .cod{font:600 11px/1 var(--mono);letter-spacing:.06em;background:var(--tinta);color:var(--hoja);padding:5px 8px}
  .evid .desc{font:600 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--tenue)}
  .evid .pts{margin-left:auto;font:11px var(--mono);color:var(--tenue)}
  .enun{font:16px/1.5 var(--sans);margin:0 0 18px;max-width:70ch}
  .nota{font-size:13px;color:var(--tenue);margin:14px 0 0;max-width:70ch}
  /* recordatorio del escenario, plegable, en cada pregunta */
  .ctx{border:1px solid var(--regla);background:var(--panel);margin:0 0 20px}
  .ctx>summary{list-style:none;cursor:pointer;padding:9px 13px;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  .ctx>summary::-webkit-details-marker{display:none}
  .ctx>summary::marker{content:""}
  .ctx>summary:hover{background:#edeade}
  .ctx .id{font:600 10px/1 var(--mono);letter-spacing:.06em;background:var(--grafito);color:var(--hoja);padding:4px 7px}
  .ctx .nom{font:600 13px var(--sans)}
  .ctx .mot{font:11px var(--mono);color:var(--tenue)}
  .ctx .abrir{margin-left:auto;font:600 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--oxido)}
  .ctx:not([open]) .abrir::after{content:"ver enunciado ▾"}
  .ctx[open] .abrir::after{content:"ocultar ▴"}
  .ctx .cue{padding:13px;border-top:1px solid var(--regla)}
  .ctx .cue p{margin:0 0 12px;font-size:13.8px;line-height:1.6}
  .ctx .cue p:last-child{margin-bottom:0}
  .ctx .cue .rot{font:600 9.5px/1 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:var(--tenue);margin:0 0 6px}
  .bloq{margin:0 0 22px}
  .subt{font:600 9.5px/1 var(--mono);letter-spacing:.15em;text-transform:uppercase;color:var(--tenue);margin:0 0 9px}

  /* ── tablas de datos ──────────────────────────────── */
  table.dat{border-collapse:collapse;width:100%;font:13px var(--mono);margin:0 0 6px}
  table.dat th{font:600 9.5px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--tenue);text-align:left;padding:7px 10px;border:1px solid var(--regla);background:var(--panel);white-space:nowrap}
  table.dat td{padding:7px 10px;border:1px solid var(--regla);vertical-align:middle}
  table.dat td.el{font-weight:700;white-space:nowrap;background:#f7f5ee}
  table.dat td.num{text-align:right}
  table.dat .mini{font:400 11px/1.4 var(--sans);color:var(--tenue);margin-top:3px}
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

  pre.ds{font:12.5px/1.65 var(--mono);white-space:pre-wrap;background:var(--panel);border:1px solid var(--regla);border-left:3px solid var(--tinta);padding:15px 17px;margin:0;max-height:340px;overflow:auto}

  /* ── formulario ───────────────────────────────────── */
  .campo{margin:0 0 15px;max-width:560px}
  .campo.ancho{max-width:none}
  label.et{display:block;font:600 13px/1.3 var(--sans);margin:0 0 6px}
  label.et .aux{font-weight:400;color:var(--tenue)}
  .in{width:100%;font:15px/1.4 var(--sans);color:var(--tinta);padding:9px 11px;border:1px solid var(--grafito);background:#fff;border-radius:0}
  .in:focus{outline:0;border-color:var(--tinta);box-shadow:inset 0 -2px 0 var(--oxido)}
  .in.mono,input.num{font:15px var(--mono)}
  input.num{text-align:right}
  textarea.in{resize:vertical;min-height:96px;line-height:1.55}
  select.in{appearance:none;background:#fff url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'><path d='M0 0l5 6 5-6z' fill='%234a4d47'/></svg>") no-repeat right 12px center/9px 6px;padding-right:32px}
  .medida{display:flex;max-width:280px}
  .medida .in{border-right:0}
  .medida .u{display:flex;align-items:center;padding:0 13px;border:1px solid var(--grafito);background:var(--panel);font:13px var(--mono);color:var(--grafito);white-space:nowrap}
  .fila2{display:grid;grid-template-columns:1fr 1fr;gap:15px;max-width:640px}
  @media(max-width:640px){.fila2{grid-template-columns:1fr}}
  .cuenta{font:11px var(--mono);color:var(--tenue);text-align:right;margin-top:4px}
  .ops{display:grid;gap:8px;max-width:560px}
  .op{display:flex;align-items:flex-start;gap:11px;border:1px solid var(--regla);background:#fff;padding:12px 14px;cursor:pointer;user-select:none}
  .op:hover{border-color:var(--grafito)}
  .op .marca{flex:none;width:15px;height:15px;border:1px solid var(--grafito);margin-top:3px;background:#fff}
  .op.sel{border-color:var(--tinta);background:#f4f1e7;box-shadow:inset 3px 0 0 var(--oxido)}
  .op.sel .marca{background:var(--tinta);border-color:var(--tinta);box-shadow:inset 0 0 0 3px #fff}
  .op b{display:block;font-size:14.5px}
  .op span.d{display:block;font-size:12.5px;color:var(--tenue);margin-top:2px}
  .op.mc{align-items:center}
  .op.mc .marca{margin-top:0}
  .op.mc .opt{font:15px var(--mono)}
  .preg{margin:0 0 24px;padding:0 0 0 0}
  .preg:last-of-type{margin-bottom:0}
  .pq{display:flex;gap:10px;align-items:baseline;font:600 15.5px/1.45 var(--sans);margin:0 0 11px;max-width:70ch}
  .pn{flex:none;width:22px;height:22px;display:grid;place-items:center;background:var(--tinta);color:var(--hoja);font:600 11px/1 var(--mono)}
  .err{font:12px var(--sans);color:var(--oxido);margin-top:5px;min-height:16px}
  input.dat-in{width:100%;font:13px var(--mono);padding:6px 8px;border:1px solid transparent;background:transparent;border-radius:0}
  input.dat-in:focus{outline:0;border-color:var(--tinta);background:#fff}
  input.dat-in::placeholder{color:#b6b3a8}

  /* ── navegación ───────────────────────────────────── */
  .nav{display:flex;gap:10px;align-items:center;margin-top:26px;padding-top:18px;border-top:1px solid var(--regla2);flex-wrap:wrap}
  .b{font:600 12px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;padding:13px 22px;border:1px solid var(--tinta);background:var(--tinta);color:var(--hoja);cursor:pointer;border-radius:0}
  .b:hover:not(:disabled){background:#000}
  .b.sec{background:transparent;color:var(--tinta)}
  .b.sec:hover{background:#eceada}
  .b:disabled{opacity:.32;cursor:not-allowed}
  .b.der{margin-left:auto}
  .b.env{background:var(--oxido);border-color:var(--oxido);color:#fff}
  .b.env:hover{background:#7d2d12}

  /* ── avisos ───────────────────────────────────────── */
  .caja{border:1px solid var(--regla);background:var(--panel);padding:16px 18px;font-size:13.5px;line-height:1.6}
  .caja.ojo{border-left:3px solid var(--oxido);background:#f7efe9}
  .caja.ok{border-left:3px solid var(--verde);background:#eef3ef}
  .legal{border:1px solid var(--regla);background:#fff;padding:18px 20px;font-size:12.8px;line-height:1.62;color:var(--grafito);max-height:290px;overflow:auto}
  .legal b{color:var(--tinta)}
  .check{display:flex;gap:11px;align-items:flex-start;margin:16px 0 0;cursor:pointer;font-size:14px;max-width:70ch}
  .check input{width:17px;height:17px;margin-top:2px;flex:none;accent-color:var(--tinta)}
  ol.reglas{margin:0;padding:0;list-style:none;counter-reset:r}
  ol.reglas li{counter-increment:r;position:relative;padding:11px 0 11px 40px;border-bottom:1px solid var(--regla2);font-size:14px}
  ol.reglas li:last-child{border-bottom:0}
  ol.reglas li::before{content:counter(r,decimal-leading-zero);position:absolute;left:0;top:12px;font:600 12px var(--mono);color:var(--oxido)}
  .sello{display:inline-block;border:2px solid var(--oxido);color:var(--oxido);font:700 26px/1 var(--mono);letter-spacing:.06em;padding:12px 20px;transform:rotate(-1.2deg)}
  .pie{border-top:1px solid var(--tinta);padding:12px 14px;display:flex;justify-content:space-between;gap:12px;font:10.5px var(--mono);color:var(--tenue);flex-wrap:wrap}
  .guardado{font:11px var(--mono);color:var(--tenue)}
  .guardado.mal{color:var(--oxido);font-weight:700}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

function reloj(ms){
  if(ms==null) return "—";
  const t = Math.max(0, Math.round(ms/1000));
  return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");
}

/* ═══════════════════ frontera con la base ═══════════════════
   Los códigos de evidencia llevan punto (A.1.1) y Realtime Database no admite
   ".", "#", "$", "/", "[" ni "]" en una clave. Por eso el código viaja como
   VALOR de fila, nunca como nombre de campo:
       [{codigo:"A.1.1", campos:{…}}, …]   en vez de   {"A.1.1":{…}, …}
   En memoria se sigue usando el mapa, que es lo cómodo para el formulario. */
const aFilas = mapa => Object.keys(mapa || {}).map(c => ({codigo:c, campos:mapa[c] || {}}));
const aMapa  = filas => {
  const o = {};
  Object.values(filas || {}).forEach(f => { if(f && f.codigo) o[f.codigo] = f.campos || {}; });
  return o;
};

function pintarCajetin(){
  const restante = S.inicio ? (S.inicio + CURSO.duracion_min*60000 - Date.now()) : null;
  const bajo = restante!=null && restante < 10*60000;
  const cel = (k,v,cls="") => `<div class="cel"><div class="k">${k}</div><div class="v ${cls}">${v}</div></div>`;
  cajetin.innerHTML =
    cel("Asignatura", esc(CURSO.codigo)+" · Corte "+CURSO.corte) +
    cel("Estudiante", S.datos ? esc(S.datos.nombre.split(" ").slice(0,2).join(" ")) : "—") +
    cel("Documento",  S.datos ? esc(S.datos.documento) : "—") +
    cel("Escenario",  S.escId ? esc(S.escId)+" · "+esc(S.E.motor) : "sin asignar", S.escId?"gr":"") +
    cel("Tiempo",     S.inicio ? reloj(restante) : CURSO.duracion_min+" min", bajo?"gr rojo":"gr");
}

function arrancarReloj(){
  if(S.tick) return;
  S.tick = setInterval(()=>{
    pintarCajetin();
    if(S.inicio && !S.enviado && Date.now() > S.inicio + CURSO.duracion_min*60000){
      clearInterval(S.tick); S.tick=null; enviar(true);

}

async function validar(){
  const nombre    = $("#f1").value.trim().replace(/\s+/g," ");
  const documento = $("#f2").value.trim();
  const correo    = $("#f3").value.trim();
  let ok = true;
  const marcar = (id,msg) => { $(id).textContent = msg; if(msg) ok = false; };
  marcar("#e1", nombre.length>=6 && nombre.includes(" ") ? "" : "Escriba nombres y apellidos completos.");
  marcar("#e2", /^[0-9]{6,15}$/.test(documento) ? "" : "Solo números, entre 6 y 15 dígitos.");
  marcar("#e3", /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo) ? "" : "Correo no válido.");
  if(!ok) return;

  const b = $("#ir"); b.disabled = true; b.textContent = "Abriendo…";
  S.datos = {nombre, documento, correo};
  S.docId = documento;
  pintarCajetin();

  try{
    const entrega = await db().ref(`${NODO}/entregas/${S.docId}`).once("value");
    if(entrega.exists()){ S.enviado = true; vRecibo(entrega.val(), true); return; }
  }catch(e){ console.warn("entregas:", e); }

  await asignarEscenario();
  recuperarLocal();          // red de seguridad local, no toca la base
  abrirSesion();
  if(S.inicio){ arrancarReloj(); vBloque(); }
  else vReglas();
}

/* ═══════════════════ 2 · sorteo del escenario ═══════════════════ */
/* Sin reemplazo por conteo: se toma el escenario menos usado y se
   desempata al azar. Si la base no responde, se cae a un reparto
   determinista por documento para no bloquear el examen. */
async function asignarEscenario(){
  const ref = db().ref(`${NODO}/asignacion/${S.docId}`);
  let id = null;
  try{
    const ya = await ref.once("value");
    if(ya.exists()) id = ya.val().escenario_id;
  }catch(e){ console.warn("asignacion lectura:", e); }

  if(!id){
    id = await sortear();
    try{
      await ref.set({escenario_id:id, documento:S.docId, nombre:S.datos.nombre, creado_en:new Date().toISOString()});
      const rele = await ref.once("value");           // gana quien escribió primero
      if(rele.exists()) id = rele.val().escenario_id;
      db().ref(`${NODO}/conteo/${id}`).transaction(n => (n||0)+1).catch(()=>{});
    }catch(e){ console.warn("asignacion escritura:", e); }
  }

  S.escId = id;
  S.E     = ESCENARIOS.find(x => x.id === id) || ESCENARIOS[0];
  S.motor = MOTORES[S.E.motor];
  pintarCajetin();
}

async function sortear(){
  try{
    const snap = await db().ref(`${NODO}/conteo`).once("value");
    const c = snap.val() || {};
    const min = Math.min(...ESCENARIOS.map(e => c[e.id] || 0));
    const pool = ESCENARIOS.filter(e => (c[e.id]||0) === min);
    return pool[Math.floor(Math.random()*pool.length)].id;
  }catch(e){
    let h = 0;
    for(const ch of S.docId) h = (h*31 + ch.charCodeAt(0)) % 100003;
    return ESCENARIOS[h % ESCENARIOS.length].id;
  }
}

/* ── selección múltiple ──
   El orden se baraja con una semilla derivada del documento y del id de la pregunta:
   estable entre recargas, distinto entre estudiantes. Se responde con el TEXTO. */
function semilla(txt){
  let h = 2166136261 >>> 0;
  for(let i=0; i<txt.length; i++){ h ^= txt.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; }
  return h >>> 0;
}
function barajar(lista, sem){
  const a = lista.slice();
  let s = sem >>> 0;
  const az = () => { s = (Math.imul(s, 1664525) + 1013904223) >>> 0; return s / 4294967296; };
  for(let i = a.length-1; i > 0; i--){ const j = Math.floor(az()*(i+1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function opcionesDe(q){
  return q.tipo === "escenario" ? (q.opciones[S.E.motor] || []) : q.opciones;
}
function mc(cod){
  return MC[cod].map((q, n) => {
    const ops = barajar(opcionesDe(q), semilla(`${S.docId||""}|${cod}|${q.id}`));
    return `<div class="preg">
      <p class="pq"><span class="pn">${n+1}</span>${esc(q.enunciado)}</p>
      <div class="ops">${ops.map(v => `<div class="op mc" data-c="${q.id}" data-v="${esc(v)}">
        <span class="marca"></span><span class="opt">${esc(v)}</span></div>`).join("")}</div>
    </div>`;
  }).join("");
}

/* ── restaurar valores y capturar cambios ── */
function restaurar(it){
  const r = S.resp[it.cod] || {};
  marco.querySelectorAll("[data-c]").forEach(el => {
    const v = r[el.dataset.c];
    if(el.classList.contains("op")) el.classList.toggle("sel", v === el.dataset.v);
    else if(v != null) el.value = v;
  });
  marco.querySelectorAll("[data-cuenta]").forEach(d => {
    const ta = marco.querySelector(`textarea[data-c="${d.dataset.cuenta}"]`);
    if(ta) d.textContent = `${ta.value.length} / ${ta.maxLength}`;
  });
}

marco.addEventListener("input", e => {
  const el = e.target.closest("[data-c]");
  if(!el || S.enviado) return;
  const it = ITEMS.find(x => x.cod === codActual()); if(!it) return;
  (S.resp[it.cod] = S.resp[it.cod] || {})[el.dataset.c] = el.value;
  const cnt = marco.querySelector(`[data-cuenta="${el.dataset.c}"]`);
  if(cnt && el.maxLength > 0) cnt.textContent = `${el.value.length} / ${el.maxLength}`;
  tocado();
});

marco.addEventListener("click", e => {
  const o = e.target.closest(".op");
  if(!o || S.enviado) return;
  const it = ITEMS.find(x => x.cod === codActual()); if(!it) return;
  marco.querySelectorAll(`.op[data-c="${o.dataset.c}"]`).forEach(x => x.classList.remove("sel"));
  o.classList.add("sel");
  (S.resp[it.cod] = S.resp[it.cod] || {})[o.dataset.c] = o.dataset.v;
  tocado();
  pintarEnviar();
});

function codActual(){
  const i = /^E[0-9]+$/.test(S.paso) ? +S.paso.slice(1) : -1;
  return i >= 0 && ITEMS[i] ? ITEMS[i].cod : null;

/* ═══════════════════ escritura con respaldo ═══════════════════
   Si las reglas publicadas rechazan el nodo del parcial, se escribe en
   diagnostico_control/<sección>/<documento>, que las reglas vigentes ya
   permiten. El envío nunca se pierde por un tema de permisos, y el panel
   lee los dos sitios. */
const RESPALDO = "diagnostico_control";
const rutaEntrega = d => [`${NODO}/entregas/${d}`, `${RESPALDO}/parcial_c1_entregas/${d}`];
const rutaSesion  = d => [`${NODO}/sesiones/${d}`, `${RESPALDO}/parcial_c1_sesiones/${d}`];

async function escribir([principal, respaldo], valor, metodo){
  try{
    await db().ref(principal)[metodo](valor);
    return {ok:true, via:"principal"};
  }catch(e){
    console.warn("nodo principal rechazado:", e && e.message);
    try{
      await db().ref(respaldo)[metodo](Object.assign({}, valor, {via:"respaldo"}));
      return {ok:true, via:"respaldo", motivo:e && e.message};
    }catch(e2){
      return {ok:false, motivo:(e && e.message) + "  ·  respaldo: " + (e2 && e2.message)};
    }
  }
}

/* ═══════════════════ 5 · sesión en línea ═══════════════════
   No se guardan borradores: las respuestas solo viajan a la base cuando el
   estudiante pulsa ENVIAR. Lo único que se publica mientras trabaja es su
   presencia y su porcentaje de avance, para que el docente vea quién está
   resolviendo. Firebase borra el nodo solo al desconectarse el navegador. */
const LATIDO_MS = 30000;
let latido = null;

const avance = () => Math.round(100 * (ITEMS.length - faltan()) / ITEMS.length);

function abrirSesion(){
  if(!S.docId || S.enviado) return;
  rutaSesion(S.docId).forEach(r => { try{ db().ref(r).onDisconnect().remove(); }catch(e){} });
  pulso();
  clearInterval(latido);
  latido = setInterval(pulso, LATIDO_MS);
}
function pulso(){
  if(!S.docId || S.enviado) return;
  escribir(rutaSesion(S.docId), {
    documento:S.docId, nombre:S.datos.nombre, escenario_id:S.escId,
    avance:avance(), respondidas:ITEMS.length - faltan(), total:ITEMS.length,
    inicio:S.inicio || null, paso:S.paso,
    visto:firebase.database.ServerValue.TIMESTAMP
  }, "update");
}
function cerrarSesion(){
  clearInterval(latido); latido = null;
  if(S.docId) rutaSesion(S.docId).forEach(r => db().ref(r).remove().catch(()=>{}));
}

/* Copia local de las respuestas, solo en este navegador: si la página se
   recarga sin querer, el estudiante no pierde lo que llevaba. No es un
   borrador en la base y el docente nunca la ve. */
const LLAVE = () => `parcial_c1_${S.docId}`;
function guardarLocal(){
  try{ localStorage.setItem(LLAVE(), JSON.stringify({resp:S.resp, inicio:S.inicio, paso:S.paso})); }
  catch(e){}
}
function recuperarLocal(){
  try{
    const v = JSON.parse(localStorage.getItem(LLAVE()) || "null");
    if(v && v.resp){ S.resp = v.resp; S.inicio = v.inicio || 0; S.paso = v.paso || "EN"; }
  }catch(e){}
}
function limpiarLocal(){ try{ localStorage.removeItem(LLAVE()); }catch(e){} }

let reloj_local = null;
function tocado(){
  clearTimeout(reloj_local);
  reloj_local = setTimeout(() => { guardarLocal(); pulso(); pintarEnviar(); }, 1000);
}

/* ═══════════════════ 6 · envío ═══════════════════ */
async function enviar(porTiempo){
  if(S.enviado) return;
  /* Sin condiciones previas: se envía lo que haya, completo o no.
     Los ocho planos se entregan por fuera y no son parte de este envío. */
  S.enviado = true;
  clearInterval(S.tick); S.tick = null;
  clearTimeout(reloj_local);
  cerrarSesion();

  const fin = new Date();
  const payload = {
    banco:VERSION_BANCO, curso:CURSO.codigo, corte:CURSO.corte, criterio:CURSO.criterio,
    instrumento:"parte_1_B1",
    nombre:S.datos.nombre, documento:S.docId, correo:S.datos.correo,
    escenario_id:S.escId, motor_id:S.E.motor,
    inicio_en:S.inicio ? new Date(S.inicio).toISOString() : null,
    enviado_en:fin.toISOString(),
    duracion_min:S.inicio ? Math.round((fin.getTime()-S.inicio)/60000) : 0,
    cerrado_por_tiempo:!!porTiempo,
    completas:ITEMS.length - faltan(),
    respuestas:aFilas(S.resp)
  };

  marco.innerHTML = `<div class="lienzo"><p class="lead" style="margin:30px 0">Enviando…</p></div>`;
  const r = await escribir(rutaEntrega(S.docId), payload, "set");
  const ok = r.ok, motivo = r.motivo || "";
  if(ok) limpiarLocal();
  if(r.via === "respaldo") console.warn("entrega guardada en el nodo de respaldo");
  vRecibo(payload, false, ok, porTiempo, motivo);
}

function vRecibo(p, previo, ok = true, porTiempo = false, motivo = ""){
  clearInterval(S.tick); S.tick = null;
  S.enviado = true;
  S.escId = p.escenario_id; S.E = ESCENARIOS.find(x=>x.id===p.escenario_id) || S.E;
  pintarCajetin();
  const planos = PLANOS.map(x=>`<tr>
      <td class="el">${esc(p.escenario_id)}_SIS-${x.sis}_${x.plano}_${esc(p.documento)}<div class="mini">${esc(seCalifica(x))}</div></td>
      <td>${esc(x.det)}</td></tr>`).join("");
  marco.innerHTML = `<div class="lienzo">
    <div class="sello">${previo ? "YA ENTREGADO" : ok ? "RECIBIDO" : "SIN CONFIRMAR"}</div>
    <h2 class="rot" style="margin-top:20px">${previo ? "Su parcial ya estaba entregado" : ok ? "Parte 1 — bloque digital entregado" : "No se pudo confirmar el envío"}</h2>
    <p class="lead">${previo
      ? "Este documento ya registró una entrega. Solo se admite un envío; si necesita corregir algo, hable con el docente."
      : ok
        ? (porTiempo ? "Se agotaron los 120 minutos y el formulario se cerró con lo que había registrado." : "Sus respuestas quedaron registradas. El bloque digital se califica contra la clave de su escenario.")
        : "El navegador no logró escribir en la base. <b>No cierre esta página</b> y avise al docente ahora mismo."}</p>
    ${!previo && !ok && motivo ? `<div class="caja ojo" style="font-family:var(--mono);font-size:12px">${esc(motivo)}</div>` : ""}
    <div class="scroll bloq"><table class="dat">
      <tr><th>Estudiante</th><td>${esc(p.nombre)}</td><th>Documento</th><td class="num">${esc(p.documento)}</td></tr>
      <tr><th>Escenario</th><td>${esc(p.escenario_id)} · ${esc((ESCENARIOS.find(x=>x.id===p.escenario_id)||{}).nombre||"")}</td>
          <th>Motor</th><td>${esc(p.motor_id)}</td></tr>
      <tr><th>Evidencias</th><td>${p.completas} de ${ITEMS.length} completas</td>
          <th>Enviado</th><td style="font-family:var(--mono);font-size:12px">${esc((p.enviado_en||"").replace("T"," ").slice(0,19))}</td></tr>
    </table></div>
    <div class="bloq" style="margin-top:26px"><div class="subt">Falta entregar — Bloque B2 · ocho archivos · 60 pts</div>
      <div class="scroll"><table class="dat">
        <tr><th style="width:320px">Nombre del archivo</th><th>Debe mostrar</th></tr>${planos}
      </table></div>
    </div>
    <div class="caja">La Parte 2 (montaje en el banco, 100 pts) se presenta por turnos en el laboratorio.</div>
  </div>`;
}

/* ═══════════════════ arranque ═══════════════════ */
window.addEventListener("beforeunload", e => {
  if(S.inicio && !S.enviado){ e.preventDefault(); e.returnValue = ""; }
});
pintarCajetin();
vAviso();
</script>
</body>
</html>
