<head>

<title>Encuesta · Autoevaluación ETITC</title>
<style>
  :root{
    --bg:#eef2f6;--surface:#fff;--ink:#172033;--muted:#5b6b82;--line:#dde4ec;
    --primary:#13476b;--accent:#c98a1a;--soft:#f4f7fa;--ok:#1f7a4d;
    --shadow:0 8px 30px rgba(16,38,64,.10);--radius:16px;
  }
  *{box-sizing:border-box}html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;padding:24px 16px}
  .wrap{max-width:780px;margin:0 auto}
  .frame{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .head{padding:26px 30px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fbfdff,#fff)}
  .eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .title{font-family:Georgia,"Times New Roman",serif;font-size:22px;line-height:1.25;margin:6px 0 0;font-weight:700;color:var(--primary)}
  .sub{font-size:13px;color:var(--muted);margin-top:8px}
  .progress{height:6px;background:var(--soft)}
  .bar{height:100%;width:0;background:linear-gradient(90deg,var(--primary),#2a6e9c);transition:width .35s ease}
  .body{padding:30px}
  .step-label{font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:14px}
  .intro-p{font-size:14.5px;color:var(--muted);margin:0 0 22px}
  .est-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media(max-width:560px){.est-grid{grid-template-columns:1fr}}
  .est{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit}
  .est:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 18px rgba(19,71,107,.12)}
  .est:focus-visible{outline:3px solid #9cc4dd;outline-offset:2px}
  .est-name{font-weight:700;font-size:15.5px;color:var(--primary)}
  .est-meta{font-size:12.5px;color:var(--muted)}
  .qcode{display:inline-block;font-family:ui-monospace,Menlo,monospace;font-size:11.5px;color:#42688a;background:#eaf2f8;border:1px solid #d2e3f0;border-radius:6px;padding:2px 8px;margin-bottom:12px}
  .qcontext{font-size:13px;color:var(--muted);font-style:italic;margin:0 0 8px}
  .qtext{font-size:17px;line-height:1.5;font-weight:600;margin:0 0 22px;color:var(--ink)}
  .opts{display:grid;gap:9px}
  .opt{position:relative;display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;cursor:pointer;transition:.13s;background:var(--surface)}
  .opt:hover{border-color:#9db9d0;background:#fafdff}
  .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid #b9c6d6;display:grid;place-items:center;transition:.13s}
  .opt-num{font-weight:700;color:var(--muted);min-width:14px}
  .opt-txt{font-size:14.5px;font-weight:500}
  .opt.sel{border-color:var(--primary);background:#eef6fb;box-shadow:inset 0 0 0 1px var(--primary)}
  .opt.sel .dot{border-color:var(--primary);background:var(--primary)}
  .opt.sel .dot::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
  .opt.sel .opt-num{color:var(--primary)}
  .subrow{border:1.5px solid var(--line);border-radius:12px;padding:14px 15px;margin-bottom:12px;background:var(--soft)}
  .subrow .lbl{font-size:14px;font-weight:600;margin-bottom:10px;color:var(--ink)}
  .scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
  @media(max-width:560px){.scale{grid-template-columns:repeat(2,1fr)}}
  .sopt{border:1.4px solid var(--line);border-radius:9px;padding:8px 4px;text-align:center;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);background:#fff;transition:.12s;line-height:1.2}
  .sopt:hover{border-color:#9db9d0}
  .sopt.sel{border-color:var(--primary);background:#eef6fb;color:var(--primary)}
  .nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px}
  .btn{font:inherit;font-weight:600;border-radius:11px;padding:11px 22px;cursor:pointer;border:1.5px solid transparent;transition:.15s}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover:not(:disabled){background:#0f3a58}
  .btn-primary:disabled{opacity:.4;cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--muted);border-color:var(--line)}
  .btn-ghost:hover:not(:disabled){border-color:#b9c6d6;color:var(--ink)}
  .btn-ghost:disabled{opacity:.35;cursor:not-allowed}
  label.field{display:block;font-weight:600;font-size:15px;margin-bottom:10px}
  select.txt,input.txt,textarea.txt{width:100%;font:inherit;font-size:15px;padding:13px 15px;border:1.5px solid var(--line);border-radius:12px;background:var(--soft)}
  textarea.txt{min-height:120px;resize:vertical;line-height:1.5}
  select.txt:focus,input.txt:focus,textarea.txt:focus{outline:none;border-color:var(--primary);background:#fff}
  .review{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:18px 20px;font-size:14px;color:var(--muted)}
  .review b{color:var(--ink)}
  .done{text-align:center;padding:20px 10px}
  .done .check{width:64px;height:64px;border-radius:50%;background:#e6f4ec;display:grid;place-items:center;margin:0 auto 18px}
  .done .check svg{width:32px;height:32px}
  .done h2{font-family:Georgia,serif;color:var(--primary);margin:0 0 8px}
  .foot{text-align:center;font-size:11.5px;color:var(--muted);padding:16px;border-top:1px solid var(--line)}
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const ESTAMENTOS=DATA.estamentos, BANCO=DATA.banco, PROGRAMAS=DATA.programas, PROG_EMP=DATA.programasEmpExtra;
const NODO="autoevaluacion_estamentos";

const ESCALA_A=[{label:"Alta",valor:1},{label:"Media",valor:2},{label:"Baja",valor:3},{label:"No responde",valor:4},{label:"No aplica",valor:5}];
const ESCALA_EMP=[{label:"Plenamente",valor:1},{label:"Alto grado",valor:1},{label:"Aceptablemente",valor:2},{label:"Insatisfactoriamente",valor:3},{label:"No se cumple",valor:3}];
function escalaDe(it){ return it.escala==="emp"?ESCALA_EMP:ESCALA_A; }

// --- Preguntas extra de Empleadores (no codificadas; se guardan en meta/necesidades) ---
const EMP_INTRO=[
  {id:"emp_razon",tipo:"texto",destino:"meta",clave:"razonSocial",etiqueta:"Razón social de su organización",ph:"Nombre de la organización"},
  {id:"emp_sector",tipo:"opcion",destino:"meta",clave:"sector",etiqueta:"¿Cuál es el sector de la economía al que pertenece su organización?",
   opciones:["Agricultura, ganadería, pesca, minería","Industria, manufactura, construcción","Comercio, servicios, transporte, turismo","Tecnología, investigación, educación, servicios financieros","Otro"],
   otro:"Otro",otroClave:"sectorOtro",otroPh:"Indique a qué sector pertenece"},
  {id:"emp_programa",tipo:"programa",etiqueta:"Seleccione el programa académico del cual proviene el egresado cuyo desempeño desea evaluar."},
  {id:"emp_correo",tipo:"texto",destino:"meta",clave:"correoOrg",etiqueta:"Digite su correo organizacional",ph:"correo@organizacion.com"},
];
const EMP_NEEDS=[
  {id:"emp_n1",tipo:"texto",multilinea:true,destino:"necesidades",clave:"educacionContinua",etiqueta:"Según su apreciación, ¿cuáles deberían ser los cursos de educación continua para la actualización de nuestros profesionales?"},
  {id:"emp_n2",tipo:"texto",multilinea:true,destino:"necesidades",clave:"especializacion",etiqueta:"¿Cuáles deberían ser los programas de nivel Especialización Universitaria para mejorar la formación de nuestros profesionales?"},
  {id:"emp_n3",tipo:"texto",multilinea:true,destino:"necesidades",clave:"maestria",etiqueta:"¿Cuáles deberían ser los programas de nivel Maestría para mejorar la formación de nuestros profesionales?"},
];

const body=document.getElementById('body'),bar=document.getElementById('bar'),headSub=document.getElementById('headSub');
let st={est:null,estName:null,programa:"",items:[],idx:0,resp:{}};
function setBar(p){bar.style.width=Math.max(0,Math.min(100,p))+"%"}

function itemsDe(est){
  if(est==="empleadores"){
    const cod=BANCO.filter(it=>it.estamentos.includes("empleadores")).map(it=>({...it,escala:"emp"}));
    return [...EMP_INTRO,...cod,...EMP_NEEDS];
  }
  return BANCO.filter(it=>it.estamentos.includes(est));
}
function countDe(est){ return itemsDe(est).length; }

function vSelector(){
  setBar(0);headSub.textContent="Seleccione el estamento al que pertenece para iniciar.";
  const cards=ESTAMENTOS.map(e=>`<button class="est" data-est="${e.id}">
    <span class="est-name">${e.nombre}</span><span class="est-meta">${countDe(e.id)} preguntas</span></button>`).join("");
  body.innerHTML=`<p class="intro-p">A través de esta encuesta la ETITC recoge información para los procesos de
    autoevaluación de sus programas. Le pedimos responder todas las preguntas con detenimiento y objetividad.</p>
    <div class="step-label">¿A qué estamento pertenece?</div><div class="est-grid">${cards}</div>`;
  body.querySelectorAll('.est').forEach(b=>b.onclick=()=>{
    const e=ESTAMENTOS.find(x=>x.id===b.dataset.est);
    st.est=e.id;st.estName=e.nombre;st.items=itemsDe(e.id);st.idx=0;st.resp={};st.programa="";
    (e.id==="empleadores")?vPregunta():vPrograma();
  });
}
function vPrograma(){
  setBar(3);headSub.textContent=st.estName;
  const lista=st.est==="empleadores"?PROGRAMAS.concat(PROG_EMP):PROGRAMAS;
  const opts=lista.map(p=>`<option value="${p}" ${st.programa===p?"selected":""}>${p}</option>`).join("");
  const etq=st.est==="empleadores"?"Programa académico del cual proviene el egresado que evalúa":"Programa académico al que pertenece";
  body.innerHTML=`<div class="step-label">${st.estName} · Antes de empezar</div>
    <label class="field" for="prog">${etq}</label>
    <select class="txt" id="prog"><option value="" disabled ${st.programa?"":"selected"}>Seleccione un programa…</option>${opts}</select>
    <div class="nav"><button class="btn btn-ghost" id="atras">Cambiar estamento</button>
    <button class="btn btn-primary" id="ir" disabled>Comenzar</button></div>`;
  const sel=document.getElementById('prog'),ir=document.getElementById('ir');
  if(st.programa)ir.disabled=false;
  sel.onchange=()=>{st.programa=sel.value;ir.disabled=!sel.value};
  document.getElementById('atras').onclick=vSelector;
  ir.onclick=()=>{st.idx=0;vPregunta()};
}

function answered(it){
  const r=st.resp[it.id];
  if(it.tipo==="matriz"){ return it.subitems.every((_,i)=>r&&r[i]); }
  if(it.tipo==="single"){ return !!(r&&r.valor); }
  if(it.tipo==="texto"){ return !!(r&&(""+r).trim()); }
  if(it.tipo==="opcion"){ if(!r)return false; if(it.otro&&r===it.otro){return !!((st.resp[it.id+'_otro']||"").trim());} return true; }
  if(it.tipo==="programa"){ return !!st.programa; }
  return false;
}

function vPregunta(){
  const total=st.items.length,it=st.items[st.idx];
  setBar(5+(st.idx/total)*90);headSub.textContent=`${st.estName} · ${st.programa||"—"}`;
  let cabe="", cuerpo="";

  if(it.tipo==="single"||it.tipo==="matriz"){
    cabe=`<span class="qcode">${it.codigos.join(" · ")}</span>${it.contexto?`<p class="qcontext">${it.contexto}</p>`:""}`;
    const esc=escalaDe(it);
    if(it.tipo==="matriz"){
      const r=st.resp[it.id]||{};
      cuerpo=it.subitems.map((s,i)=>{
        const cells=esc.map((o,oi)=>`<div class="sopt ${r[i]&&r[i].opt===oi?'sel':''}" data-i="${i}" data-o="${oi}">${o.label}</div>`).join("");
        return `<div class="subrow"><div class="lbl">${s.etiqueta}</div><div class="scale">${cells}</div></div>`;
      }).join("");
    } else {
      const a=st.resp[it.id];
      cuerpo=`<div class="opts">`+esc.map((o,oi)=>`<div class="opt ${a&&a.opt===oi?'sel':''}" data-o="${oi}">
        <span class="dot"></span><span class="opt-num">${oi+1}.</span><span class="opt-txt">${o.label}</span></div>`).join("")+`</div>`;
    }
  } else if(it.tipo==="texto"){
    const v=st.resp[it.id]||"";
    cuerpo = it.multilinea
      ? `<textarea class="txt" id="campo" placeholder="Escriba su respuesta…">${v}</textarea>`
      : `<input class="txt" id="campo" type="text" placeholder="${it.ph||""}" value="${v.replace(/"/g,'&quot;')}">`;
  } else if(it.tipo==="opcion"){
    const v=st.resp[it.id];
    cuerpo=`<div class="opts">`+it.opciones.map(o=>`<div class="opt ${v===o?'sel':''}" data-v="${o.replace(/"/g,'&quot;')}">
      <span class="dot"></span><span class="opt-txt">${o}</span></div>`).join("")+`</div>`;
    if(it.otro && v===it.otro){
      cuerpo+=`<input class="txt" id="campoOtro" style="margin-top:10px" type="text" placeholder="${it.otroPh||''}" value="${(st.resp[it.id+'_otro']||'').replace(/"/g,'&quot;')}">`;
    }
  } else if(it.tipo==="programa"){
    const lista=PROGRAMAS.concat(PROG_EMP);
    const opts=lista.map(p=>`<option value="${p}" ${st.programa===p?"selected":""}>${p}</option>`).join("");
    cuerpo=`<select class="txt" id="campoProg"><option value="" disabled ${st.programa?"":"selected"}>Seleccione un programa…</option>${opts}</select>`;
  }

  body.innerHTML=`<div class="step-label">Pregunta ${st.idx+1} de ${total}</div>
    ${cabe}<p class="qtext">${it.etiqueta||it.texto}</p>${cuerpo}
    <div class="nav"><button class="btn btn-ghost" id="prev">Anterior</button>
    <button class="btn btn-primary" id="next" ${answered(it)?"":"disabled"}>${st.idx===total-1?"Revisar":"Siguiente"}</button></div>`;
  const next=document.getElementById('next');

  if(it.tipo==="matriz"){
    const esc=escalaDe(it);
    body.querySelectorAll('.sopt').forEach(c=>c.onclick=()=>{
      const i=+c.dataset.i,oi=+c.dataset.o;st.resp[it.id]=st.resp[it.id]||{};
      st.resp[it.id][i]={opt:oi,valor:esc[oi].valor,nivel:esc[oi].label};
      body.querySelectorAll(`.sopt[data-i="${i}"]`).forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
      next.disabled=!answered(it);
    });
  } else if(it.tipo==="single"){
    const esc=escalaDe(it);
    body.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{
      const oi=+o.dataset.o;st.resp[it.id]={opt:oi,valor:esc[oi].valor,nivel:esc[oi].label};
      body.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));o.classList.add('sel');
      next.disabled=false;
    });
  } else if(it.tipo==="texto"){
    document.getElementById('campo').oninput=e=>{ st.resp[it.id]=e.target.value; next.disabled=!answered(it); };
  } else if(it.tipo==="opcion"){
    body.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ st.resp[it.id]=o.dataset.v; vPregunta(); });
    const co=document.getElementById('campoOtro');
    if(co)co.oninput=e=>{ st.resp[it.id+'_otro']=e.target.value; next.disabled=!answered(it); };
  } else if(it.tipo==="programa"){
    document.getElementById('campoProg').onchange=e=>{ st.programa=e.target.value; next.disabled=!answered(it); };
  }
  document.getElementById('prev').onclick=()=>{ if(st.idx>0){st.idx--;vPregunta();} else { st.est==="empleadores"?vSelector():vPrograma(); } };
  next.onclick=()=>{if(!answered(it))return;if(st.idx<total-1){st.idx++;vPregunta()}else vRevisar()};
}

function vRevisar(){
  setBar(97);const total=st.items.length;const cont=st.items.filter(answered).length;
  body.innerHTML=`<div class="step-label">Revisión final</div>
    <div class="review">Estamento: <b>${st.estName}</b><br>Programa: <b>${st.programa||"—"}</b><br>
    Preguntas respondidas: <b>${cont} de ${total}</b></div>
    <div class="nav"><button class="btn btn-ghost" id="volver">Volver</button>
    <button class="btn btn-primary" id="enviar">Enviar respuestas</button></div>`;
  document.getElementById('volver').onclick=()=>{st.idx=total-1;vPregunta()};
  document.getElementById('enviar').onclick=enviar;
}

function payload(){
  const out={estamento:st.est,programa:st.programa||null,enviadoEn:new Date().toISOString()};
  const respuestas=[],meta={},necesidades={};
  st.items.forEach(it=>{
    const r=st.resp[it.id];
    if(it.tipo==="matriz"){
      const m=r||{};
      respuestas.push({id:it.id,codigos:it.codigos,tipo:"matriz",
        sub:it.subitems.map((s,i)=>({codigos:s.codigos,etiqueta:s.etiqueta,valor:m[i]?m[i].valor:null,nivel:m[i]?m[i].nivel:null}))});
    } else if(it.tipo==="single"){
      respuestas.push({id:it.id,codigos:it.codigos,valor:r?r.valor:null,nivel:r?r.nivel:null});
    } else if(it.tipo==="texto"||it.tipo==="opcion"){
      const dst=it.destino==="necesidades"?necesidades:meta;
      dst[it.clave]=(r!=null?(""+r).trim():null)||null;
      if(it.tipo==="opcion"&&it.otroClave&&r===it.otro){ meta[it.otroClave]=(st.resp[it.id+'_otro']||"").trim()||null; }
    }
  });
  out.respuestas=respuestas;
  if(Object.keys(meta).length)out.meta=meta;
  if(Object.keys(necesidades).length)out.necesidades=necesidades;
  return out;
}

async function enviar(){
  const b=document.getElementById('enviar');b.disabled=true;b.textContent="Enviando…";
  const d=payload();
  try{
    if(window.firebase&&firebase.apps&&firebase.apps.length){await firebase.database().ref(NODO).push(d);}
    else{console.log("[preview] Firebase no inicializado. Payload:",d);await new Promise(r=>setTimeout(r,600));}
    vGracias();
  }catch(e){console.error(e);b.disabled=false;b.textContent="Reintentar envío";alert("No se pudo enviar. Revise su conexión e intente de nuevo.");}
}
function vGracias(){
  setBar(100);headSub.textContent="Registro completado";
  body.innerHTML=`<div class="done"><div class="check"><svg viewBox="0 0 24 24" fill="none" stroke="#1f7a4d" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></div>
    <h2>¡Gracias!</h2><p class="intro-p" style="margin:0">Sus respuestas se registraron correctamente.</p></div>`;
}
vSelector();
</script>
