<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fuente de alimentación de 12 V</title><style>
.iso{
  --fig-page:#0b0b0b;--fig-card:#131313;--fig-text:#a3a3a3;--fig-strong:#e6e6e6;--fig-muted:#6e6e6e;
  --fig-paper:#131313;--fig-face:#1b1b1b;--fig-top:#1c1c1c;
  --fig-shade-0:#0f0f0f;--fig-shade-1:#121212;--fig-shade-2:#151515;--fig-shade-3:#181818;
  --fig-lit-top:#262626;--fig-lit-shade:#1d1d1d;
  --fig-hi:#d4d4d4;--fig-mid:#6a6a6a;--fig-lo:#3e3e3e;--fig-faint:#2a2a2a;--fig-lit:#ffffff;
  --fig-halo:#050505;--fig-halo-opacity:.9;--fig-dot:#e6e6e6;
  --fig-red:#ff6b6b;--fig-green:#6be0a0;--fig-blue:#6b9bff;
  --fig-weight:.6px;--fig-ease:cubic-bezier(.32,.72,0,1);
  --fig-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fig-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --fig-page:#f2f2ef;--fig-card:#fbfbfa;--fig-text:#57575a;--fig-strong:#18181a;--fig-muted:#8c8c90;
  --fig-paper:#fbfbfa;--fig-face:#ffffff;--fig-top:#ffffff;
  --fig-shade-0:#dcdcd9;--fig-shade-1:#e5e5e2;--fig-shade-2:#ededea;--fig-shade-3:#f4f4f1;
  --fig-lit-top:#ffffff;--fig-lit-shade:#eeeeeb;
  --fig-hi:#26262a;--fig-mid:#8a8a8f;--fig-lo:#b4b4b8;--fig-faint:#d4d4d6;--fig-lit:#000000;
  --fig-halo:#8a8a80;--fig-halo-opacity:.32;--fig-dot:#3a3a3e;
  --fig-red:#e5484d;--fig-green:#30a46c;--fig-blue:#3e63dd;
  --fig-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--fig-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--fig-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--fig-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--fig-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--fig-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--fig-shade-3)}
.iso-top{fill:var(--fig-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--fig-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--fig-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--fig-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--fig-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--fig-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--fig-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--fig-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--fig-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--fig-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--fig-lit)}
.iso-halo{fill:var(--fig-halo);stroke:none;filter:blur(9px);opacity:var(--fig-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--fig-lo);stroke-width:var(--fig-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--fig-hi)}
.iso-line[data-tone="mid"]{stroke:var(--fig-mid)}
.iso-line[data-tone="lo"]{stroke:var(--fig-lo)}
.iso-line[data-tone="faint"]{stroke:var(--fig-faint)}
.iso-line[data-tone="lit"]{stroke:var(--fig-lit)}
.iso-line[data-tone="red"]{stroke:var(--fig-red)}
.iso-line[data-tone="green"]{stroke:var(--fig-green)}
.iso-line[data-tone="blue"]{stroke:var(--fig-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--fig-paper);stroke:var(--fig-lo);stroke-width:var(--fig-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--fig-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--fig-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--fig-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--fig-lit)}
.iso-dots circle{fill:var(--fig-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--fig-mid);font-family:var(--fig-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--fig-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--fig-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--fig-faint)}
.tb-body{fill:var(--fig-shade-2);stroke:none}
.tb-shine{fill:var(--fig-top);stroke:none}
.tb-shade{fill:var(--fig-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--fig-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--fig-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--fig-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--fig-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--fig-card);box-shadow:0 0 0 1px var(--fig-mid);--fig-paper:var(--fig-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--fig-muted);font-family:var(--fig-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--fig-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--fig-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--fig-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--fig-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--fig-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--fig-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--fig-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--fig-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--fig-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--fig-blue)}
.iso-swatch-crease{stroke:var(--fig-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--fig-page);color:var(--fig-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

.iso[data-theme="light"]{
  --fig-page:#f4f1ea;--fig-card:#fbfaf6;--fig-text:#4a4c52;--fig-strong:#16181d;--fig-muted:#8b8c90;
  --fig-paper:#fbfaf6;--fig-face:#ffffff;--fig-top:#ffffff;
  --fig-shade-0:#d9d6ce;--fig-shade-1:#e3e0d8;--fig-shade-2:#ebe8e1;--fig-shade-3:#f3f1eb;
  --fig-lit-top:#f2f5fd;--fig-lit-shade:#dfe6f8;
  --fig-hi:#16181d;--fig-mid:#86878c;--fig-lo:#b3b2ae;--fig-faint:#d3d1cb;--fig-lit:#1f5bd8;
  --fig-dot:#33353a;--fig-blue:#1f5bd8;
  --fig-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --if-azul:#1f5bd8;--if-chispa:#ffc21a;--if-tinta:#16181d;--if-papel:#f4f1ea;
}
body.iso{font-family:"Geist",system-ui,sans-serif;background:var(--fig-page)}
.if-cab{max-width:760px;margin:32px auto 0;padding:0 16px;color:var(--fig-text)}
.if-cab h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(26px,5vw,40px);line-height:1.05;letter-spacing:-.02em;color:var(--if-tinta);margin:0 0 8px}
.if-cab p{margin:0;font-size:15px;line-height:1.5;max-width:60ch}
.if-cab .if-autor{margin-top:10px;font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--fig-muted)}
.if-chispa{fill:var(--if-chispa)!important;stroke:#b98400!important}
.iso-line[data-tone="lit"]{stroke:var(--if-azul)}

.iv{display:none}
body.modo-video{margin:0;overflow:hidden;background:var(--if-papel)}
body.modo-video .if-cab,body.modo-video .iso-figure{display:none}
body.modo-video .iv{display:block;position:fixed;left:0;top:0;width:1280px;height:720px;overflow:hidden;background:var(--if-papel);color:var(--if-tinta);font-family:"Geist",system-ui,sans-serif}
.iv-fig{position:absolute;left:330px;top:64px;width:920px;height:570px;display:flex;align-items:center;justify-content:center}
.iv-fig svg{width:920px;height:auto;max-height:570px}
.iv-marca{position:absolute;left:56px;right:56px;top:40px;display:flex;justify-content:space-between;align-items:baseline;font-family:"JetBrains Mono",monospace;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#8b8c90}
.iv-tit{color:var(--if-tinta)}
.iv-cap{position:absolute;left:56px;bottom:74px;max-width:470px}
.iv-cap .c{font-family:"JetBrains Mono",monospace;font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--if-azul);margin-bottom:10px}
.iv-cap .t{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:42px;line-height:1.04;letter-spacing:-.025em}
.iv-cap .x{margin-top:12px;font-size:18px;line-height:1.4;color:#4a4c52;max-width:440px}
.iv-cap .w{display:inline-block;will-change:transform,opacity}
.iv-cap .sub{display:block;height:3px;width:0;background:var(--if-azul);margin-top:14px}
.iv-cap .sub i{display:block;height:3px;width:10px;background:var(--if-chispa);margin-left:auto}
.iv-lect{position:absolute;right:56px;bottom:58px;font-family:"JetBrains Mono",monospace;font-size:14px;color:#4a4c52;text-align:right;max-width:520px}
.iv-barra{position:absolute;left:56px;right:56px;bottom:40px;height:2px;background:#dedbd3}
.iv-barra i{display:block;height:2px;width:0;background:var(--if-tinta)}
body.modo-video.sin-rotulos .iv-cap,body.modo-video.sin-rotulos .iv-marca,body.modo-video.sin-rotulos .iv-lect,body.modo-video.sin-rotulos .iv-barra{display:none}
body.modo-video.sin-rotulos .iv-fig{left:90px;top:30px;width:1100px;height:660px}
body.modo-video.sin-rotulos .iv-fig svg{width:1100px;max-height:660px}

.if-flujo{fill:none;stroke:var(--if-azul);stroke-linecap:round;stroke-dasharray:0.01 7;opacity:0}
.if-flujo[data-on]{opacity:1}
.if-traza{fill:none;stroke:var(--fig-lo);stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.if-vidrio{fill:var(--fig-shade-1);transition:fill .8s ease}
.if-panel[data-dia] .if-vidrio{fill:var(--fig-lit-shade)}
.if-panel[data-dia] .if-celdas{stroke:var(--if-azul);opacity:.45}
.if-d[data-on] .iso-solid>.iso-top{fill:var(--fig-lit-top)}
.if-d[data-on] .iso-solid>.iso-shade{fill:var(--fig-lit-shade)}
.if-d[data-on] .iso-solid>.iso-edge{stroke:var(--if-azul)}
.if-d[data-on] .iso-solid[data-seamless]>.iso-shade{stroke:var(--fig-lit-shade)}
.if-sw{cursor:pointer}
.if-sw .if-pal[data-pos="off"],.if-sw[data-on] .if-pal[data-pos="on"]{display:block}
.if-sw .if-pal[data-pos="on"],.if-sw[data-on] .if-pal[data-pos="off"]{display:none}
.if-sw[data-on] .if-pal .iso-edge{stroke:var(--if-azul)}
.if-sw:hover .iso-solid>.iso-edge{stroke:var(--if-azul)}
.if-piloto[data-on] .iso-shade,.if-piloto[data-on] .iso-top{fill:var(--if-chispa)!important;stroke:var(--if-chispa)!important}
.if-piloto[data-on] .iso-edge{stroke:#a87800}
.if-ctl{display:flex;flex-wrap:wrap;gap:6px;margin:10px 4px 2px;font-family:"JetBrains Mono",monospace;font-size:12px}
.if-ctl button{font:inherit;cursor:pointer;border:1px solid #cfccc4;background:var(--fig-card);color:var(--fig-text);border-radius:6px;padding:6px 9px;line-height:1.2}
.if-ctl button[aria-pressed="true"]{border-color:var(--if-azul);color:var(--if-azul);background:#eef2fc}
.if-ctl button:focus-visible{outline:2px solid var(--if-azul);outline-offset:2px}
.if-ctl .if-sep{flex-basis:100%;height:0}
.if-ctl .if-lbl{align-self:center;color:var(--fig-muted);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-right:2px}
.if-estado{margin:8px 4px 0;font-size:13.5px;line-height:1.5;color:var(--fig-text)}
.if-estado b{color:var(--if-tinta);font-weight:600}
.if-estado .if-cond{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--if-azul)}

(() => {
